<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Usage</title>
<script src="/preload.js"></script>
<style>
  :root {
    --c-system: #9aa0a6;
    --c-user: #a8c7fa;
    --c-agent: #4c8df6;
    --c-tool: #f9ab00;
    --c-custom: #c58af9;
    --c-sysmsg: #f28b82;
    --fg: var(--foreground, #e3e3e3);
    --dim: var(--muted-foreground, #9aa0a6);
    --line: var(--border, rgba(127, 127, 127, .25));
    --empty: color-mix(in srgb, var(--dim) 28%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* thin overlay-style scrollbar instead of the platform default */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 30%, transparent);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--dim) 55%, transparent); }

  /* preload.js zeroes the body's padding, so the page padding lives here */
  main { padding: 12px 14px 18px; }
  .dim { color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .model { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--empty); flex: none; }
  .live.on { background: #81c995; }
  .usage { margin: 2px 0 12px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .usage .big { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .usage .of { color: var(--dim); }
  .usage .pct { margin-left: auto; font-size: 13px; font-weight: 600; }
  button {
    font: inherit; font-size: 12px; color: var(--dim); cursor: pointer; white-space: nowrap;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  }
  button:hover { color: var(--fg); border-color: var(--dim); }

  /* grid: each dot is 1% of the context window */
  .grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; max-width: 320px; margin-bottom: 4px; }
  .dot { aspect-ratio: 1; border-radius: 50%; background: var(--empty); }
  .legend { font-size: 11px; color: var(--dim); margin-bottom: 4px; }

  /* sections */
  section { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; display: flex; justify-content: space-between; }
  h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .note { font-size: 12px; color: var(--dim); margin: -2px 0 8px; }
  .group + .group { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 10px 1fr auto 42px; align-items: center; gap: 8px; padding: 2.5px 0; }
  .row .tok { text-align: right; }
  .row .p { text-align: right; color: var(--dim); font-size: 12px; }
  .mark { width: 8px; height: 8px; border-radius: 50%; }
  .mark.sq { border-radius: 2px; }
  .mark.free { background: transparent; border: 1.5px solid var(--empty); }

  .files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; }
  .files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .dir { display: block; font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .files .tok { color: var(--dim); font-size: 12px; align-self: start; }
  ul { list-style: none; margin: 0; padding: 0; }
  .ck-main { display: flex; justify-content: space-between; gap: 8px; }
  .badge { font-size: 11px; color: #81c995; border: 1px solid color-mix(in srgb, #81c995 40%, transparent); border-radius: 999px; padding: 0 7px; white-space: nowrap; }

  /* quotas */
  .q-details summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .q-details summary::-webkit-details-marker { display: none; }
  .q-details summary h2 { margin: 0; }
  .q-details[open] summary { margin-bottom: 6px; }
  .q-btn { font-size: 11px; padding: 1px 7px; }
  .q-note { font-size: 11px; color: var(--dim); margin: 0 0 6px; }
  .q-row { display: grid; grid-template-columns: minmax(110px, 1fr) 64px 42px auto; align-items: center; gap: 8px; padding: 3px 0; font-size: 12.5px; }
  .q-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-bar { display: block; height: 6px; border-radius: 999px; background: var(--empty); overflow: hidden; }
  .q-fill { display: block; height: 100%; border-radius: 999px; background: #81c995; }
  .q-fill.mid { background: #f9ab00; }
  .q-fill.low { background: #f28b82; }
  .q-pct { text-align: right; font-weight: 500; font-size: 12px; }
  .q-rst { text-align: right; color: var(--dim); font-size: 11px; white-space: nowrap; }

  .empty { margin: 48px 8px; text-align: center; color: var(--dim); }
  footer { margin-top: 16px; font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main id="main"><p class="empty">加载中…</p></main>

<script>
(() => {
  const POLL_MS = 3000;
  const SEGMENT_COLORS = ['var(--c-system)', 'var(--c-user)', 'var(--c-agent)', 'var(--c-tool)', 'var(--c-custom)'];
  const CONVERSATION = { user: 'var(--c-user)', agent: 'var(--c-agent)', tool: 'var(--c-tool)', system_messages: 'var(--c-sysmsg)' };
  const SYSTEM = new Set(['system_prompt', 'system_tools', 'system_overhead']);
  const CATEGORY_NAMES = {
    user: '用户消息',
    agent: '智能体回复',
    tool: '工具调用',
    system_messages: '系统消息',
    system_prompt: '系统提示词',
    system_tools: '系统工具',
    system_overhead: '系统开销',
    rules: '规则',
    skills: '技能',
    subagents: '子智能体',
    legacy_workflows: '旧版工作流',
    workflows: '工作流',
    plugins: '插件',
    mcp: 'MCP 工具',
  };
  const params = new URLSearchParams(location.search);
  const conversationId = (window.sidecar && window.sidecar.conversationId) || params.get('conversationId') || '';
  const doFetch = (window.sidecar && window.sidecar.fetch) || fetch;
  const main = document.getElementById('main');
  let workspace = '';
  let report = null;
  let lastJson = '';
  let inFlight = false;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function fmtTok(n) {
    if (n >= 1e6) { const v = n / 1e6; return Number.isInteger(v) ? `${v}M` : `${v.toFixed(1)}M`; }
    if (n >= 1e3) return `${(n / 1e3).toFixed(1)}k`;
    return String(n);
  }

  // The CLI's cell allocation: at least one cell per non-empty segment, scaled down on overflow.
  function gridCells(segments, limit, total) {
    let counts = segments.map((t) => (!t || !limit ? 0 : Math.max(1, Math.floor(t / limit * total))));
    const used = counts.reduce((a, b) => a + b, 0);
    if (used > total) counts = counts.map((c) => Math.floor(c * total / used));
    return [...counts, total - counts.reduce((a, b) => a + b, 0)];
  }

  function grid(r) {
    const counts = gridCells(r.grid_segments, r.limit_tokens, 100);
    let dots = '';
    counts.forEach((n, i) => {
      dots += (i === 5 ? '<span class="dot"></span>' : `<span class="dot" style="background:${SEGMENT_COLORS[i]}"></span>`).repeat(n);
    });
    return `<div class="grid" title="每个圆点代表上下文窗口的 1%">${dots}</div>`;
  }

  function categoryRow(c, limit) {
    const color = CONVERSATION[c.key] || (SYSTEM.has(c.key) ? 'var(--c-system)' : 'var(--c-custom)');
    const shape = CONVERSATION[c.key] ? '' : ' sq';
    const label = CATEGORY_NAMES[c.key] || c.name;
    return `<div class="row"><span class="mark${shape}" style="background:${color}"></span><span>${esc(label)}</span>`
      + `<span class="tok num">${fmtTok(c.tokens)}</span><span class="p num">${c.pct.toFixed(1)}%</span></div>`;
  }

  function categories(r) {
    const conv = r.categories.filter((c) => CONVERSATION[c.key]);
    const rest = r.categories.filter((c) => !CONVERSATION[c.key]);
    const limit = r.limit_tokens;
    const freePct = limit ? (r.free_tokens / limit * 100).toFixed(1) : '0.0';
    const free = `<div class="row"><span class="mark free"></span><span class="dim">剩余空间</span>`
      + `<span class="tok num">${fmtTok(r.free_tokens)}</span><span class="p num">${freePct}%</span></div>`;
    let headingNote = '';
    if (r.heading && r.heading !== 'Token usage by category') {
      const zhHeading = r.heading
        .replace('Estimated usage (awaiting generation)', '估算用量（等待生成）')
        .replace('Estimated after compaction · updates next turn', '压缩后估算 · 下一轮更新');
      headingNote = `<p class="note">${esc(zhHeading)}</p>`;
    }
    const buffer = r.checkpoint_buffer
      ? `<p class="note">检查点缓存：${fmtTok(r.checkpoint_buffer)} tokens（不计入用量）</p>` : '';
    return `<section><h2>Token 用量</h2>${headingNote}
      <div class="group">${conv.map((c) => categoryRow(c, limit)).join('')}</div>
      ${rest.length ? `<div class="group">${rest.map((c) => categoryRow(c, limit)).join('')}</div>` : ''}
      <div class="group">${free}</div>${buffer}</section>`;
  }

  function checkpoints(r) {
    const ck = r.checkpoint_view;
    if (!ck) return '';
    const older = ck.historical ? `<div class="dim" style="font-size:12px">另有 ${ck.historical} 个较早检查点已摘要，不在当前上下文中</div>` : '';
    return `<section><h2>检查点 <span class="hint">${ck.count} · /rewind</span></h2>
      <div class="ck-main"><span>检查点 ${ck.active_number}: ${esc(ck.active_text)}</span><span class="badge">上下文中</span></div>${older}</section>`;
  }

  function splitPath(path) {
    const trimmed = path.replace(/\/$/, '');
    const i = trimmed.lastIndexOf('/');
    const name = trimmed.slice(i + 1) + (path.endsWith('/') ? '/' : '');
    let dir = i > 0 ? trimmed.slice(0, i) : '';
    if (conversationId) dir = dir.replace(new RegExp(`^.*/brain/${conversationId}`), '会话目录');
    return { name, dir };
  }

  function files(title, hint, items) {
    if (!items || !items.length) return '';
    const rows = items.map((f) => {
      const { name, dir } = splitPath(f.path);
      return `<li title="${esc(f.path)}"><span class="name">${esc(name)}<span class="dir">‎${esc(dir)}</span></span>`
        + `<span class="tok num">${f.tokens > 0 ? fmtTok(f.tokens) : ''}</span></li>`;
    }).join('');
    return `<section><h2>${title} <span class="hint">${hint}</span></h2><ul class="files">${rows}</ul></section>`;
  }

  function fmtReset(iso) {
    if (!iso) return '';
    const t = Date.parse(iso);
    if (Number.isNaN(t)) return '';
    const diff = t - Date.now();
    if (diff <= 0) return '即将重置';
    const mins = Math.round(diff / 60000);
    if (mins < 60) return `${mins}分后重置`;
    const hours = Math.floor(mins / 60);
    const remM = mins % 60;
    if (hours < 24) return remM ? `${hours}h${remM}m` : `${hours}h`;
    const d = new Date(t);
    return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function quotasSection(list) {
    if (!list || !list.length) return '';
    const rows = list.map((q) => {
      const pct = Math.max(0, Math.min(100, q.remainingFraction * 100));
      const cls = pct <= 20 ? ' low' : (pct <= 50 ? ' mid' : '');
      const rst = fmtReset(q.resetTime);
      const rstTitle = q.resetTime ? `重置时间：${new Date(q.resetTime).toLocaleString()}` : '';
      return `<div class="q-row" title="${esc(q.family)} · 剩余 ${pct.toFixed(1)}%${rstTitle ? ' · ' + esc(rstTitle) : ''}">`
        + `<span class="q-name">${esc(q.family)}</span>`
        + `<span class="q-bar"><span class="q-fill${cls}" style="width:${pct.toFixed(1)}%"></span></span>`
        + `<span class="q-pct num">${pct.toFixed(1)}%</span>`
        + `<span class="q-rst num">${esc(rst)}</span></div>`;
    }).join('');
    return `<section><details class="q-details" id="q-details"><summary><h2>模型接口余量（点击展开）</h2><button id="refresh-quota" class="q-btn" title="立即刷新各模型剩余额度">刷新</button></summary><p class="q-note">数据源为模型接口单池口径；周额度 / 5 小时双窗口请以左下角官方用量为准。</p>${rows}</details></section>`;
  }

  function render(r) {
    const wasOpen = Boolean(document.getElementById('q-details')?.open);
    const limit = r.limit_tokens;
    main.innerHTML = `
      <div class="top">
        <div class="model"><span class="live on" title="实时同步"></span>${esc(r.model)}</div>
        <button id="copy" title="复制 CLI 格式的纯文本报告">复制文本</button>
      </div>
      <div class="usage">
        <span class="big num">${fmtTok(r.used_tokens)}</span>
        <span class="of">/ ${limit ? fmtTok(limit) : '未知'} tokens</span>
        ${limit ? `<span class="pct num">${r.used_pct.toFixed(1)}%</span>` : ''}
      </div>
      ${grid(r)}
      ${quotasSection(r.quotas)}
      ${categories(r)}
      ${checkpoints(r)}
      ${files('知识文件', '/rules', r.knowledge_files)}
      ${files('产物文件', '/artifact', r.artifact_files)}
      ${files('技能文件', '/skill', r.skill_files)}
      ${files('系统文件', '自动加载', r.system_files)}
      <footer><span>相关命令：/artifact · /skill · /rewind</span><span>更新于 ${esc(new Date(r.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</span></footer>`;
    if (wasOpen) {
      const det = document.getElementById('q-details');
      if (det) det.open = true;
    }
    document.getElementById('copy').addEventListener('click', copy);
    const rq = document.getElementById('refresh-quota');
    if (rq) rq.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); refresh(true); });
  }

  function showMessage(text) {
    report = null;
    lastJson = '';
    main.innerHTML = `<p class="empty">${esc(text)}</p>`;
  }

  async function copy(event) {
    if (!report) return;
    try {
      await navigator.clipboard.writeText(report.text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = report.text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    const btn = event.currentTarget;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = '复制文本'; }, 1500);
  }

  async function refresh(forceQuota = false) {
    if (document.hidden || inFlight) return;
    inFlight = true;
    try {
      const qs = new URLSearchParams({ conversationId, workspace });
      if (forceQuota) qs.set('forceQuota', '1');
      const res = await doFetch(`/api/report?${qs}`);
      const data = await res.json();
      if (data.error === 'no-conversation') return showMessage('请打开一个对话以查看其上下文用量。');
      if (data.error === 'no-database') return showMessage('当前对话尚无已保存数据，请先发送一条消息。');
      if (data.error) {
        if (report) {
          const dot = document.querySelector('.live');
          if (dot) dot.classList.remove('on');
          return;
        }
        return showMessage(`暂时无法读取对话数据：${data.message || data.error}`);
      }
      const dot = document.querySelector('.live');
      if (dot) dot.classList.add('on');
      const json = JSON.stringify(data);
      if (json === lastJson) return;
      lastJson = json;
      report = data;
      render(data);
    } catch {
      const dot = document.querySelector('.live');
      if (dot) dot.classList.remove('on');
    } finally {
      inFlight = false;
    }
  }

  document.addEventListener('visibilitychange', refresh);

  async function start() {
    if (window.sidecar && window.sidecar.getWorkspaceUris) {
      const uris = await window.sidecar.getWorkspaceUris();
      workspace = uris[0] || '';
      window.sidecar.onWorkspaceChange((next) => {
        if ((next[0] || '') !== workspace) { workspace = next[0] || ''; lastJson = ''; refresh(); }
      });
    }
    refresh();
    setInterval(refresh, POLL_MS);
  }
  start();
})();
</script>
</body>
</html>
